<template>
    <div class="cards-view">

        <template if:false={sections.data}>
            <template if:false={sections.error}>
                <div class="loading-state">
                    <lightning-spinner alternative-text="Loading sections" size="medium"></lightning-spinner>
                </div>
            </template>
        </template>

        <template if:true={sections.error}>
            <p class="slds-text-color_error slds-p-around_medium">Failed to load sections.</p>
        </template>

        <template if:true={hasNoSections}>
            <div class="empty-state">
                <lightning-icon icon-name="utility:collection" size="large" class="slds-m-bottom_medium"></lightning-icon>
                <p class="slds-text-heading_small">No sections yet</p>
                <p class="slds-text-color_weak slds-m-top_x-small slds-m-bottom_medium">
                    Create a section to start adding flashcards.
                </p>
                <lightning-button label="Add Section" variant="brand" onclick={handleNewSection}></lightning-button>
            </div>
        </template>

        <template if:true={hasSections}>
            <div class="section-grid">
                <template for:each={sections.data} for:item="sec">
                    <c-section-card
                        key={sec.Id}
                        section-id={sec.Id}
                        section-title={sec.Title__c}
                        is-starred={sec.isStarred}
                        star-id={sec.starId}
                        oneditsection={handleEditSection}
                        ondeletesection={handleDeleteSection}
                        onstarsection={handleStarSection}
                    >
                        <!-- Card list items -->
                        <template if:true={sec.cards}>
                            <template if:true={sec.hasCards}>
                                <template for:each={sec.cards} for:item="card">
                                    <div key={card.Id} class="card-item">
                                        <span class="card-order">#{card.displayOrder}</span>
                                        <span class="card-front">{card.Front__c}</span>
                                        <div class="card-item-actions" onclick={stopProp}>
                                            <lightning-button-icon
                                                icon-name={card.starIcon}
                                                variant="bare"
                                                size="x-small"
                                                title="Star"
                                                data-item-id={card.Id}
                                                onclick={handleStarToggle}
                                            ></lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:arrowup"
                                                variant="bare"
                                                size="x-small"
                                                title="Move Up"
                                                data-card-id={card.Id}
                                                data-section-id={sec.Id}
                                                data-direction="up"
                                                onclick={handleMoveCard}
                                            ></lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:arrowdown"
                                                variant="bare"
                                                size="x-small"
                                                title="Move Down"
                                                data-card-id={card.Id}
                                                data-section-id={sec.Id}
                                                data-direction="down"
                                                onclick={handleMoveCard}
                                            ></lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:edit"
                                                variant="bare"
                                                size="x-small"
                                                title="Edit Card"
                                                data-card-id={card.Id}
                                                data-section-id={sec.Id}
                                                onclick={handleEditCard}
                                            ></lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                variant="bare"
                                                size="x-small"
                                                title="Delete Card"
                                                data-card-id={card.Id}
                                                data-section-id={sec.Id}
                                                onclick={handleDeleteCard}
                                            ></lightning-button-icon>
                                        </div>
                                    </div>
                                </template>
                            </template>
                            <template if:false={sec.hasCards}>
                                <p class="empty-cards-msg">No cards yet.</p>
                            </template>
                        </template>
                        <template if:false={sec.cards}>
                            <div class="slds-p-around_small">
                                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                            </div>
                        </template>

                        <!-- Footer: Add Card + Open Deck -->
                        <div slot="footer-action" class="section-footer-actions">
                            <lightning-button
                                label="Add Card"
                                variant="brand-outline"
                                icon-name="utility:add"
                                size="small"
                                data-section-id={sec.Id}
                                onclick={handleNewCard}
                            ></lightning-button>
                            <template if:true={sec.hasCards}>
                                <lightning-button
                                    label="Open Deck"
                                    variant="brand"
                                    icon-name="utility:forward"
                                    size="small"
                                    data-section-id={sec.Id}
                                    data-section-title={sec.Title__c}
                                    onclick={handleOpenDeck}
                                ></lightning-button>
                            </template>
                        </div>
                    </c-section-card>
                </template>
            </div>
        </template>

        <template if:true={sections.data}>
            <div class="fab-container">
                <lightning-button
                    label="Add Section"
                    variant="brand"
                    icon-name="utility:add"
                    onclick={handleNewSection}
                ></lightning-button>
            </div>
        </template>

    </div>

    <!-- ── Carousel ──────────────────────────────────────────────── -->
    <c-card-carousel
        is-open={carouselIsOpen}
        cards={carouselCards}
        section-title={carouselSectionTitle}
        oncarouselclose={handleCarouselClose}
    ></c-card-carousel>

    <!-- ── Modals ─────────────────────────────────────────────────── -->

    <!-- Create/Edit Section -->
    <c-lwc-modal
        header={sectionModalHeader}
        confirm-button-label="Save"
        confirm-button-variant="brand"
        validate-on-confirm
        onbuttonclick={handleSectionModalButton}
        class="section-modal"
    >
        <div slot="body">
            <lightning-input
                label="Section Title"
                value={sectionDraft.title}
                required
                maxlength="120"
                onchange={handleSectionTitleChange}
            ></lightning-input>
        </div>
    </c-lwc-modal>

    <!-- Delete Section -->
    <c-lwc-modal
        header="Delete Section"
        body-text={deleteSectionBodyText}
        confirm-button-label="Delete"
        confirm-button-variant="destructive"
        onbuttonclick={handleDeleteSectionConfirm}
        class="delete-section-modal"
    ></c-lwc-modal>

    <!-- Card wizard (3 pages) -->
    <c-lwc-modal
        header={cardWizardHeader}
        confirm-button-label={cardWizardConfirmLabel}
        confirm-button-variant="brand"
        validate-on-confirm
        onbuttonclick={handleCardWizardButton}
        class="card-wizard-modal"
    >
        <div slot="body">
            <p class="wizard-step-label">{wizardStepLabel}</p>

            <!-- Page 1: Front -->
            <template if:true={isWizardPage1}>
                <lightning-textarea
                    label="Front"
                    value={cardDraft.front}
                    required
                    max-length="16448"
                    placeholder="What do you want to remember?"
                    class="card-front-input"
                    onchange={handleCardFrontChange}
                ></lightning-textarea>
            </template>

            <!-- Page 2: Back -->
            <template if:true={isWizardPage2}>
                <div class="rich-text-wrapper">
                    <label class="slds-form-element__label">Back</label>
                    <lightning-input-rich-text
                        value={cardDraft.back}
                        placeholder="The answer, explanation, or definition..."
                        onchange={handleCardBackChange}
                    ></lightning-input-rich-text>
                </div>
            </template>

            <!-- Page 3: Resources (Phase 7 placeholder) -->
            <template if:true={isWizardPage3}>
                <div class="resources-placeholder">
                    <lightning-icon icon-name="utility:link" size="large"></lightning-icon>
                    <p class="slds-m-top_small slds-text-color_weak">
                        Resource linking will be available in Phase 7.
                    </p>
                    <p class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">
                        Click Save to finish creating this card.
                    </p>
                </div>
            </template>
        </div>

        <!-- Previous button in customButtons slot -->
        <template if:true={showWizardPrevButton}>
            <lightning-button
                slot="customButtons"
                label="← Previous"
                onclick={handleWizardPrev}
            ></lightning-button>
        </template>
    </c-lwc-modal>

    <!-- Delete Card -->
    <c-lwc-modal
        header="Delete Card"
        body-text={deleteCardBodyText}
        confirm-button-label="Delete"
        confirm-button-variant="destructive"
        onbuttonclick={handleDeleteCardConfirm}
        class="delete-card-modal"
    ></c-lwc-modal>

</template>
